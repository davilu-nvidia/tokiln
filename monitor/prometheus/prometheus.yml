# Persistent-layer scraping (the experiment-time quick dashboard is aa-loadgen/monitor; the two layers join on run_id, see monitor/integration.md)
global: {scrape_interval: 5s}
scrape_configs:
  - job_name: sglang
    static_configs: [{targets: ["node1:8000", "node2:30001"]}]  # TODO: align worker metrics ports
  - job_name: dcgm
    static_configs: [{targets: ["node1:9400", "node2:9400"]}]
  - job_name: dynamo-frontend
    static_configs: [{targets: ["node1:8000"]}]
