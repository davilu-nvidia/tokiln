# M0: single-node pure SGLang; the compatibility gate and the fallback shape.
profile:
  name: m0-sglang-only
  runtime: sglang-direct
  frontend: {port: 8000, mode: openai}
  workers:
    - {node: node1, gpus: "0-7", parallel: {tp: 8}, mem_fraction: 0.90}
  kv: {l1: radix}
  limits: {max_concurrency: 128, timeout_s: 600}
