# Formal A/B conclusions come from replay (real trajectories, OSL pinned via ignore_eos).
workload: {name: agentic-replay, tool: aa-loadgen, mode: replay}
params:
  trace: third_party/aa-loadgen/replay/examples/astropy-12907.dsv4flash.dag.jsonl  # TODO: switch to a full300-scale long trace
  concurrency: 32
  agent_context: true
ab: {arms: [A, B], vary: router.kind, values: [thunderagent, kv-aware]}
note: "Replaying DSV4 traces on GLM-5.2 is a load test; behavioral conclusions about GLM require re-recording traces with GLM before M2."
