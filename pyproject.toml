[project]
name = "tokiln"
version = "0.1.0"
description = "Tokiln control plane: declarative deploy, probes, bench orchestration for Dynamo+SGLang token factory"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "jinja2", "httpx", "aiohttp"]

[project.scripts]
tokiln = "tokiln.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokiln*"]
